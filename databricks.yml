bundle:
  name: lyonflow-databricks

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog name
    default: lyonflow
  alert_email:
    description: Email address notified on job failure
    default: patrice.noel.duclos@gmail.com

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://<your-workspace>.cloud.databricks.com
