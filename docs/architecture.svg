<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="480" fill="#ffffff"/>

  <!-- Sources -->
  <rect x="20" y="170" width="150" height="140" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="95" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Sources</text>
  <text x="95" y="230" text-anchor="middle" font-size="12" fill="#333">Vélo'v GBFS</text>
  <text x="95" y="248" text-anchor="middle" font-size="11" fill="#666">(1 min)</text>
  <text x="95" y="272" text-anchor="middle" font-size="12" fill="#333">CRITER WFS</text>
  <text x="95" y="290" text-anchor="middle" font-size="11" fill="#666">(référence annuelle)</text>

  <line x1="170" y1="240" x2="215" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bronze -->
  <rect x="220" y="120" width="190" height="240" rx="8" fill="#cd7f32" fill-opacity="0.18" stroke="#8a5a22" stroke-width="1.5"/>
  <text x="315" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c3d17">BRONZE</text>
  <text x="315" y="172" text-anchor="middle" font-size="11" fill="#5c3d17">Delta, append-only</text>
  <rect x="240" y="190" width="150" height="34" rx="4" fill="#fff" stroke="#8a5a22"/>
  <text x="315" y="211" text-anchor="middle" font-size="11" fill="#333">velov_raw</text>
  <rect x="240" y="234" width="150" height="34" rx="4" fill="#fff" stroke="#8a5a22"/>
  <text x="315" y="255" text-anchor="middle" font-size="11" fill="#333">criter_raw</text>
  <text x="315" y="300" text-anchor="middle" font-size="10" fill="#5c3d17">notebooks/01, 02</text>
  <text x="315" y="316" text-anchor="middle" font-size="10" fill="#5c3d17">Databricks Workflows</text>
  <text x="315" y="332" text-anchor="middle" font-size="10" fill="#5c3d17">(planifié)</text>

  <line x1="410" y1="240" x2="455" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="432" y="230" text-anchor="middle" font-size="10" fill="#666">DLT</text>

  <!-- Silver -->
  <rect x="460" y="120" width="190" height="240" rx="8" fill="#9aa5b1" fill-opacity="0.25" stroke="#4a5560" stroke-width="1.5"/>
  <text x="555" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b3238">SILVER</text>
  <text x="555" y="172" text-anchor="middle" font-size="11" fill="#2b3238">nettoyé, dédupliqué</text>
  <rect x="480" y="190" width="150" height="34" rx="4" fill="#fff" stroke="#4a5560"/>
  <text x="555" y="211" text-anchor="middle" font-size="11" fill="#333">velov_clean</text>
  <rect x="480" y="234" width="150" height="34" rx="4" fill="#fff" stroke="#4a5560"/>
  <text x="555" y="255" text-anchor="middle" font-size="11" fill="#333">criter_clean</text>
  <text x="555" y="300" text-anchor="middle" font-size="10" fill="#2b3238">expect_or_drop</text>
  <text x="555" y="316" text-anchor="middle" font-size="10" fill="#2b3238">(qualité données)</text>

  <line x1="650" y1="240" x2="695" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="672" y="230" text-anchor="middle" font-size="10" fill="#666">DLT</text>

  <!-- Gold -->
  <rect x="700" y="120" width="190" height="240" rx="8" fill="#e8c547" fill-opacity="0.3" stroke="#8a6d00" stroke-width="1.5"/>
  <text x="795" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#5c4a00">GOLD</text>
  <text x="795" y="172" text-anchor="middle" font-size="11" fill="#5c4a00">agrégé, métier</text>
  <rect x="720" y="190" width="150" height="34" rx="4" fill="#fff" stroke="#8a6d00"/>
  <text x="795" y="211" text-anchor="middle" font-size="11" fill="#333">velov_hourly_agg</text>
  <rect x="720" y="234" width="150" height="34" rx="4" fill="#fff" stroke="#8a6d00"/>
  <text x="795" y="255" text-anchor="middle" font-size="11" fill="#333">criter_site_stats</text>

  <line x1="890" y1="240" x2="935" y2="240" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Consommation -->
  <rect x="940" y="120" width="240" height="240" rx="8" fill="#f5f5f5" stroke="#333" stroke-width="1.5"/>
  <text x="1060" y="150" text-anchor="middle" font-size="15" font-weight="bold" fill="#111">Consommation</text>
  <text x="1060" y="185" text-anchor="middle" font-size="12" fill="#333">Databricks SQL / Genie</text>
  <text x="1060" y="203" text-anchor="middle" font-size="11" fill="#666">dashboard, langage naturel</text>
  <text x="1060" y="235" text-anchor="middle" font-size="12" fill="#333">MLflow → Model Serving</text>
  <text x="1060" y="253" text-anchor="middle" font-size="11" fill="#666">endpoint prédiction temps réel</text>
  <text x="1060" y="285" text-anchor="middle" font-size="12" fill="#333">Vector Search + Agent RAG</text>
  <text x="1060" y="303" text-anchor="middle" font-size="11" fill="#666">(optionnel)</text>

  <!-- Gouvernance -->
  <rect x="220" y="390" width="920" height="60" rx="8" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="680" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#111">Unity Catalog — gouvernance, catalogage, permissions, data lineage</text>
  <text x="680" y="435" text-anchor="middle" font-size="11" fill="#666">catalog lyonflow · schémas bronze / silver / gold</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
