resources:
  jobs:
    # Vélo'v = flux temps réel -> cadence rapprochée (30 min, ajustable).
    # CRITER = stats de référence annuelle -> job séparé, cadence rare (voir
    # lyonflow_criter_job ci-dessous), inutile de le réingérer à chaque run.
    lyonflow_ingestion_job:
      name: lyonflow-ingestion-and-pipeline
      schedule:
        quartz_cron_expression: "0 */30 * * * ?"
        timezone_id: Europe/Paris
        pause_status: PAUSED
      email_notifications:
        on_failure:
          - ${var.alert_email}
      tasks:
        - task_key: ingest_velov
          notebook_task:
            notebook_path: ../notebooks/01_bronze_ingestion_velov.py
            base_parameters:
              catalog: ${var.catalog}
        - task_key: run_dlt_pipeline
          depends_on:
            - task_key: ingest_velov
          pipeline_task:
            pipeline_id: ${resources.pipelines.lyonflow_dlt_pipeline.id}

    lyonflow_criter_job:
      name: lyonflow-criter-refresh
      schedule:
        quartz_cron_expression: "0 0 6 * * MON"
        timezone_id: Europe/Paris
        pause_status: PAUSED
      tasks:
        - task_key: ingest_criter
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion_criter.py
            base_parameters:
              catalog: ${var.catalog}
